{% extends "base.html" %}

{% block content %}
<div class="content">
    <div class="container-fluid">
        <h4 class="page-title">Org Members</h4>

        <div class="card">
            <div class="card-header">
                <div class="card-title">List of Organization Members</div>
            </div>

            <div class="card-body">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Student</th>
                            <th>Organization</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for obj in object_list %}
                        <tr>
                            <td>{{ obj.student }}</td>
                            <td>{{ obj.organization }}</td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="2">No members found.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
