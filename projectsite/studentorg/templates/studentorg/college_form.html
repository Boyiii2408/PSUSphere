{% extends "base.html" %}

{% block content %}
<div class="content">
    <div class="container-fluid">
        <h4 class="page-title">College Form</h4>

        <div class="card">
            <div class="card-header">
                <div class="card-title">
                    {% if object %}Edit{% else %}Add{% endif %} College
                </div>
            </div>

            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}

                    <button type="submit" class="btn btn-success">
                        Save
                    </button>
                    <a href="{% url 'college-list' %}" class="btn btn-secondary">
                        Cancel
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
