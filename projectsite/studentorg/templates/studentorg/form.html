{% extends "base.html" %}

{% block content %}

<div class="card">
    <div class="card-body">
        <h3 class="mb-3">Form</h3>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn btn-success">Save</button>
            <a href="javascript:history.back()" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>

{% endblock %}
