{% extends "base.html" %}

{% block content %}

<div class="card">
    <div class="card-body text-center">
        <h3>Confirm Delete</h3>
        <p>Are you sure you want to delete this?</p>

        <form method="post">
            {% csrf_token %}
            <button class="btn btn-danger">Delete</button>
            <a href="javascript:history.back()" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>

{% endblock %}
