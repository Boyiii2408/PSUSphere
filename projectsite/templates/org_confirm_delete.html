{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h3>Are you sure you want to delete this organization?</h3>

    <p><strong>{{ object.name }}</strong></p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'organization-list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
