{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="content">
    <div class="container-fluid">
        <h4 class="page-title">Colleges</h4>

        <div class="row">
            <div class="col-md-12">
                <div class="card">

                    <div class="card-header">
                        <div class="card-title">List of Colleges</div>
                    </div>

                    <div class="col-md-12 row mt-3">
                        <div class="col-md-6">
                            <form class="navbar-left navbar-form nav-search mr-md-3">
                                <div class="input-group">
                                    <input type="text" placeholder="Search ..." class="form-control" />
                                    <div class="input-group-append">
                                        <span class="input-group-text">
                                            <i class="la la-search search-icon"></i>
                                        </span>
                                    </div>
                                </div>
                            </form>
                        </div>

                        <div class="col-md-6 text-right">
                            <a href="{% url 'college-add' %}" class="btn btn-success btn-rounded">
                                Add College
                            </a>
                        </div>
                    </div>

                    <div class="card-body">
                        <table class="table table-striped mt-3">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th width="150">Action</th>
                                </tr>
                            </thead>

                            <tbody>
                                {% for college in object_list %}
                                <tr>
                                    <td>{{ college.name }}</td>
                                    <td>
                                        <a href="{% url 'college-edit' college.pk %}">Edit</a> |
                                        <a href="{% url 'college-delete' college.pk %}" class="text-danger">
                                            Delete
                                        </a>
                                    </td>
                                </tr>
                                {% empty %}
                                <tr>
                                    <td colspan="2" class="text-center">
                                        <p class="text-sm font-weight-bold mb-0">
                                            No Records Found
                                        </p>
                                    </td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>

                        {% include 'includes/pagination.html' %}
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
